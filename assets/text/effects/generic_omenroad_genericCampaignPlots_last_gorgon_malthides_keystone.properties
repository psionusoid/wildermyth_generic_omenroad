~01~~panel_001~3_hero=<hero2.exists:<hero.bookish/coward/goofball/loner/snark/60:[face:interested]You can say I get anxious to enter a new library, but I don't often [i]force the door.[]/[face:interested]There's... old blood. See it, on the step? Should we just go [i]in?[] Or.../Well, the door [i]was[] forced open. But I know some people who get pretty rabid about literature?[face:happy]/This door was forced.[face:grim]/Loose hinges, little bit of blood on the step. [face:dubious]This's going to be a mess./Eyes up, <hero.hothead.80:and get vicious./and careful.> This door was [i]forced.[][face:grim]>/>
~01~~panel_001~4_hero=<hero2.exists:/The door was forced, and there's no one around. Seems like a fight to [i]me.[][face:grim]>
